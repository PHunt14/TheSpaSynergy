# =============================================================================
# SITE OFFLINE build spec.
#
# This repo's Amplify Hosting app (branch `main`) uses THIS file. It publishes
# only the static "site unavailable" page in public-offline/.
#
# It intentionally has NO backend phase, so deploying it does NOT run
# `ampx pipeline-deploy` and does NOT touch, redeploy, or modify the Amplify
# backend (AppSync / DynamoDB / Lambdas / Cognito). The backend keeps running
# untouched until a separate, deliberate teardown (see takedown/RUNBOOK.md).
#
# The served artifact is a single static HTML file with zero runtime dependency
# on any AWS backend resource.
#
# To bring the real app back: restore the previous amplify.yml from git history
# (git revert / git checkout <prev-commit> -- amplify.yml) and redeploy.
# The previous full-build spec is preserved in git history and mirrored at
# takedown/amplify.full.yml for convenience.
# =============================================================================
version: 1
frontend:
  phases:
    build:
      commands: []
  artifacts:
    baseDirectory: public-offline
    files:
      - 'index.html'
  cache:
    paths: []
