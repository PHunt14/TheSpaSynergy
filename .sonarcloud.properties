sonar.projectKey=PHunt14_TheSpaSynergy
sonar.organization=phunt14

sonar.sources=app,lib,amplify,services
sonar.tests=__tests__,services/payment-service/__tests__
sonar.test.inclusions=**/*.test.mjs,**/*.test.ts,**/*.test.js

sonar.exclusions=\
  .next/**,\
  .amplify/**,\
  node_modules/**,\
  scripts/**,\
  docs/**,\
  infrastructure/**,\
  **/coverage/**,\
  app/api/vendors/**,\
  app/vendors/**

sonar.cpd.exclusions=__tests__/**,services/payment-service/__tests__/**,app/booking/bundle/**

# Suppress ALL issues reported against test files — we do not want any
# SonarQube findings raised on test sources.
sonar.issue.ignore.multicriteria=t1,t2
sonar.issue.ignore.multicriteria.t1.ruleKey=*
sonar.issue.ignore.multicriteria.t1.resourceKey=**/__tests__/**
sonar.issue.ignore.multicriteria.t2.ruleKey=*
sonar.issue.ignore.multicriteria.t2.resourceKey=**/*.test.*
