sonar.projectKey=PHunt14_TheSpaSynergy
sonar.organization=phunt14

sonar.sources=app,lib,amplify,services
sonar.tests=services/payment-service/__tests__
sonar.test.inclusions=**/*.test.mjs,**/*.test.ts,**/*.test.js
sonar.test.exclusions=__tests__/**

sonar.exclusions=\
  .next/**,\
  .amplify/**,\
  node_modules/**,\
  scripts/**,\
  docs/**,\
  infrastructure/**,\
  **/coverage/**,\
  app/api/vendors/**,\
  app/vendors/**,\
  __tests__/**

sonar.cpd.exclusions=__tests__/**,services/payment-service/__tests__/**,app/booking/bundle/**

sonar.issue.ignore.multicriteria=t1,t2,t3
sonar.issue.ignore.multicriteria.t1.ruleKey=*:S6418
sonar.issue.ignore.multicriteria.t1.resourceKey=**/__tests__/**
sonar.issue.ignore.multicriteria.t2.ruleKey=javascript:S2699
sonar.issue.ignore.multicriteria.t2.resourceKey=**/__tests__/**/*.property.test.mjs
sonar.issue.ignore.multicriteria.t3.ruleKey=*
sonar.issue.ignore.multicriteria.t3.resourceKey=**/__tests__/**
