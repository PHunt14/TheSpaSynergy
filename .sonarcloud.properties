sonar.projectKey=PHunt14_TheSpaSynergy
sonar.organization=phunt14

sonar.sources=app,lib,amplify,services

# Exclude ALL test files from analysis entirely so no issues are ever raised
# against them. We intentionally do NOT declare them via sonar.tests, because
# analysis-scoped exclusions are honored reliably (including by SonarCloud
# Automatic Analysis) whereas per-rule issue-ignore multicriteria are not.
sonar.exclusions=\
  .next/**,\
  .amplify/**,\
  node_modules/**,\
  scripts/**,\
  docs/**,\
  infrastructure/**,\
  **/coverage/**,\
  app/api/vendors/**,\
  app/vendors/**,\
  **/__tests__/**,\
  **/*.test.mjs,\
  **/*.test.ts,\
  **/*.test.js,\
  **/*.spec.mjs,\
  **/*.spec.ts,\
  **/*.spec.js,\
  **/__mocks__/**,\
  e2e/**,\
  playwright.config.*,\
  jest.config.*,\
  jest.setup.*

# CPD (copy-paste) exclusions. These files contain intentionally repetitive
# *data* or near-identical structural markup, not duplicated logic:
#   - app/booking/bundle/**        : bundle booking markup
#   - app/dashboard/help/page.jsx  : the platformUpdates changelog is an array
#     of same-shape release-note objects rendered by one component; each entry
#     necessarily shares the { version, date, title, changes[] } structure.
# Only copy-paste detection is disabled here; all other analysis still applies.
sonar.cpd.exclusions=**/__tests__/**,app/booking/bundle/**,app/dashboard/help/page.jsx
