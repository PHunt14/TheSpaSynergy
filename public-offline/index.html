<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Site Unavailable</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f1ec;
      color: #3a3a3a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      line-height: 1.6;
    }
    .card {
      max-width: 32rem;
      width: 100%;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e5ded3;
      border-radius: 14px;
      padding: 3rem 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #2b2b2b;
    }
    p {
      font-size: 1.05rem;
      color: #5a5a5a;
    }
    .divider {
      width: 48px;
      height: 3px;
      background: #c9bfa9;
      border-radius: 2px;
      margin: 1.5rem auto;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Site Unavailable</h1>
    <div class="divider" aria-hidden="true"></div>
    <p>Contact Administrator</p>
  </main>
</body>
</html>
